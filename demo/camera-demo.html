<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health-Fitness-AI-Analyzer Camera Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #081320;
        --panel: #0f1d2d;
        --card: #13263d;
        --accent: #68e0d5;
        --text: #edf6ff;
        --muted: #a6b7c8;
        --warning: #ffb454;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg), #0b1828 100%);
        color: var(--text);
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(1.8rem, 3vw, 3rem);
        margin: 0;
      }

      .status {
        background: rgba(104, 224, 213, 0.12);
        border: 1px solid rgba(104, 224, 213, 0.4);
        border-radius: 999px;
        padding: 10px 16px;
        color: var(--accent);
        font-weight: 600;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.45fr 0.9fr;
        gap: 22px;
      }

      .panel {
        background: rgba(19, 38, 61, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 18px 30px rgba(0,0,0,0.18);
      }

      .video-wrap {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        background: #040b11;
        min-height: 440px;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #02060a;
      }

      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.02)),
          linear-gradient(to right, rgba(104,224,213,0.12), rgba(104,224,213,0.12));
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: none;
        background: linear-gradient(135deg, #68e0d5, #4bb7ff);
        color: #071926;
        font-weight: 700;
        border-radius: 10px;
        padding: 12px 18px;
        cursor: pointer;
      }

      button.secondary {
        background: rgba(255,255,255,0.08);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .score-card {
        display: grid;
        gap: 14px;
      }

      .score {
        font-size: clamp(2rem, 4vw, 3.4rem);
        font-weight: 800;
        margin: 0;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 10px;
      }

      .metric {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 12px;
      }

      .metric strong {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .metric span {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .note {
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h1>Health-Fitness-AI-Analyzer</h1>
        <div class="status" id="status">Waiting for camera access</div>
      </div>

      <div class="layout">
        <div class="panel">
          <div class="video-wrap">
            <video id="video" playsinline autoplay muted></video>
            <div class="overlay"></div>
          </div>
          <div class="controls">
            <button id="start-camera">Start camera</button>
            <button id="stop-camera" class="secondary">Stop camera</button>
          </div>
        </div>

        <aside class="panel score-card">
          <div>
            <div class="note">Current assessment</div>
            <p class="score" id="overall-score">--</p>
          </div>
          <div class="metrics">
            <div class="metric"><strong>Health</strong><span id="health-score">--</span></div>
            <div class="metric"><strong>Functional</strong><span id="functional-score">--</span></div>
            <div class="metric"><strong>Posture</strong><span id="posture-score">--</span></div>
            <div class="metric"><strong>Symmetry</strong><span id="symmetry-score">--</span></div>
            <div class="metric"><strong>Mobility</strong><span id="mobility-score">--</span></div>
            <div class="metric"><strong>Movement</strong><span id="movement-score">--</span></div>
          </div>
          <div class="note" id="summary-text">
            Camera feed is not active yet. Start the live feed to generate a live assessment.
          </div>
        </aside>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
    <script src="../src/index.js"></script>
    <script src="../src/camera.js"></script>
    <script>
      const statusNode = document.getElementById('status');
      const summaryText = document.getElementById('summary-text');
      const video = document.getElementById('video');
      const overallScore = document.getElementById('overall-score');
      const healthScore = document.getElementById('health-score');
      const functionalScore = document.getElementById('functional-score');
      const postureScore = document.getElementById('posture-score');
      const symmetryScore = document.getElementById('symmetry-score');
      const mobilityScore = document.getElementById('mobility-score');
      const movementScore = document.getElementById('movement-score');
      const hrValue = document.createElement('div');
      hrValue.className = 'metric';
      hrValue.innerHTML = '<strong>Heart rate</strong><span id="heart-rate-score">--</span>';
      document.querySelector('.metrics').appendChild(hrValue);

      let streamController = null;
      let processingFrame = false;

      async function renderAssessment(metrics) {
        const assessment = HealthFitnessAIAnalyzer.createCameraAssessment({
          bmi: 27.4,
          waistCm: 91,
          hipCm: 102,
          heightCm: 170,
          sex: 'male',
          ...metrics
        });

        overallScore.textContent = assessment.overallScore.toFixed(1);
        healthScore.textContent = assessment.healthScore.toFixed(1);
        functionalScore.textContent = assessment.functionalScore.toFixed(1);
        postureScore.textContent = metrics.posture;
        symmetryScore.textContent = metrics.symmetry;
        mobilityScore.textContent = metrics.mobility;
        movementScore.textContent = metrics.movement;
        document.getElementById('heart-rate-score').textContent = `${assessment.heartRate || 0} bpm`;

        const stateLabel = assessment.personDetected ? 'Person detected' : 'No person detected';
        summaryText.textContent = `Status: ${assessment.status}. ${stateLabel}. Presence ${assessment.personPresence.toFixed(2)}/1. Camera confidence ${metrics.confidence}/100. Heart rate ${assessment.heartRate || 0} bpm.`;
      }

      async function processFrame() {
        if (!video || !video.videoWidth || processingFrame) {
          return;
        }

        processingFrame = true;
        try {
          const detection = await HealthFitnessAIAnalyzerCamera.detectFacePresence(video);
          const motionMetrics = HealthFitnessAIAnalyzerCamera.estimateFrameMetrics(video);
          const heartRateSignal = HealthFitnessAIAnalyzerCamera.estimateHeartRateFromSkinPixels(video, 90, 30);
          const metrics = {
            ...motionMetrics,
            ...detection,
            confidence: Math.max(motionMetrics.confidence, detection.confidence),
            hasPerson: detection.hasPerson,
            personPresence: detection.personPresence,
            heartRate: heartRateSignal
          };
          await renderAssessment(metrics);
        } catch (error) {
          console.warn('Face detection unavailable, falling back to motion heuristic.', error);
          const fallback = HealthFitnessAIAnalyzerCamera.estimateFrameMetrics(video);
          fallback.heartRate = 0;
          await renderAssessment(fallback);
        } finally {
          processingFrame = false;
        }
      }

      async function startCamera() {
        try {
          const devices = await HealthFitnessAIAnalyzerCamera.listCameraDevices();
          statusNode.textContent = devices.length ? `${devices.length} camera(s) detected` : 'Camera ready';

          streamController = await HealthFitnessAIAnalyzerCamera.startCameraStream({
            videoElement: video,
            constraints: { facingMode: 'user', width: 1280, height: 720 },
            onFrame() {
              processFrame();
            }
          });

          statusNode.textContent = 'Live camera stream active';
        } catch (error) {
          console.error(error);
          statusNode.textContent = error.message;
          summaryText.textContent = 'Camera access was blocked or unavailable. Allow webcam access in the browser to continue.';
        }
      }

      document.getElementById('start-camera').addEventListener('click', startCamera);
      document.getElementById('stop-camera').addEventListener('click', () => {
        if (streamController && typeof streamController.stop === 'function') {
          streamController.stop();
        }
        if (video.srcObject) {
          video.srcObject.getTracks().forEach((track) => track.stop());
        }
        statusNode.textContent = 'Camera stopped';
        overallScore.textContent = 'N/A';
        healthScore.textContent = 'N/A';
        functionalScore.textContent = 'N/A';
        postureScore.textContent = '--';
        symmetryScore.textContent = '--';
        mobilityScore.textContent = '--';
        movementScore.textContent = '--';
        document.getElementById('heart-rate-score').textContent = '--';
        summaryText.textContent = 'Camera feed is not active yet. Start the live feed to generate a live assessment.';
      });
    </script>
  </body>
</html>
